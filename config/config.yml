server:
  applicationConnectors:
    - type: https
      port: ${API_PORT}
      keyStorePath: ${KEYSTORE_PATH}
      keyStorePassword: ${KEYSTORE_PASSWORD}
      keyStoreType: JKS

database:
  url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/
  name: ${DB_NAME}
  user: ${DB_USER}
  password: ${DB_PASSWORD}
